services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-software1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uml_platform
      POSTGRES_USER: proyecto
      POSTGRES_PASSWORD: proyecto_local
    volumes:
      - proyecto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto -d uml_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto-software1-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://proyecto:proyecto_local@postgres:5432/uml_platform?schema=public
      PORT: "3002"
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GENERATED_PROJECTS_PATH: /app/storage/generated-projects
      ARTIFACT_STORAGE_PATH: /app/storage/artifacts
    ports:
      - "3002:3002"
    volumes:
      - proyecto_generated:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3002,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002/api
        NEXT_PUBLIC_WS_URL: http://localhost:3002
    container_name: proyecto-software1-frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  proyecto_postgres_data:
  proyecto_generated:
